# ====================================================================
# SonarQube Scanner Configuration - VIPER SCM System Baseline
# SE3002 Software Quality Engineering - Assignment #01
# ====================================================================

# Unique Project Identification
sonar.projectKey=VIPER-SCM-SE3002
sonar.projectName=VIPER Supply Chain Management Baseline v1.0
sonar.projectVersion=1.0.0

# Source File Directories to Scan
sonar.sources=src,supabase
sonar.tests=

# Encoding
sonar.sourceEncoding=UTF-8

# Inclusion & Exclusion Patterns
sonar.exclusions=**/node_modules/**,**/dist/**,**/.git/**,**/.system_generated/**,**/extracted_*.txt

# Target Environments
sonar.javascript.environments=browser,node
sonar.javascript.lcov.reportPaths=
